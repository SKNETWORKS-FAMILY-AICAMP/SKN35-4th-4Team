{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · Langration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="auth">
        <section class="card">
            <span class="logo"><svg class="i" data-i="logo"></svg></span>
            <h1>Langration</h1>
            <p class="sub">LangChain 버전 마이그레이션 코드 어시스턴트. 옛 코드를 최신 버전으로 고치고, 근거와 검사 결과를 함께 보여 드려요.</p>

            <form id="auth-form" data-mode="login">
                {% csrf_token %}
                <label for="user-id">아이디</label>
                <input class="field" type="text" id="user-id" name="user_id" placeholder="내 아이디" autocomplete="username" required autofocus>
                <label for="password">비밀번호</label>
                <input class="field" type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
                <button class="btn primary" type="submit">로그인</button>
                <p class="msg" id="message"></p>
            </form>

            <p class="switch">처음이신가요? <a href="/login/signup/">아이디 만들기</a></p>
        </section>
        <p class="foot">로그인하면 이전 대화를 이어서 볼 수 있어요.</p>
    </main>

    <script src="{% static 'js/icons.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
