{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 만들기 · Langration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="auth">
        <section class="card">
            <span class="logo"><svg class="i" data-i="logo"></svg></span>
            <h1>아이디 만들기</h1>
            <p class="sub">아이디와 비밀번호를 정하면 바로 시작할 수 있어요.</p>

            <form id="auth-form" data-mode="signup">
                {% csrf_token %}
                <label for="user-id">사용할 아이디</label>
                <input class="field" type="text" id="user-id" name="user_id" placeholder="한글 · 영문 · 숫자 · _ 2~20자"
                       autocomplete="username" required minlength="2" maxlength="20" autofocus>
                <p class="hint">이미 있는 아이디는 쓸 수 없어요.</p>
                <label for="password">비밀번호</label>
                <input class="field" type="password" id="password" name="password" placeholder="6자 이상"
                       autocomplete="new-password" required minlength="6" maxlength="64">
                <label for="password-confirm">비밀번호 확인</label>
                <input class="field" type="password" id="password-confirm" name="password_confirm" placeholder="한 번 더 입력"
                       autocomplete="new-password" required minlength="6" maxlength="64">
                <button class="btn primary" type="submit">시작하기</button>
                <p class="msg" id="message"></p>
            </form>

            <p class="switch">이미 아이디가 있나요? <a href="/login/">로그인</a></p>
        </section>
    </main>

    <script src="{% static 'js/icons.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
