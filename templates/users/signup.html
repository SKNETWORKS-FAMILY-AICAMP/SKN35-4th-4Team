{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 · LangChain 마이그레이션 어시스턴트</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
    <main class="card">
        <h1>회원가입</h1>
        <p class="sub">사용할 아이디만 정하면 바로 시작할 수 있어요.</p>

        <form id="auth-form" data-mode="signup">
            {% csrf_token %}
            <input type="text" id="user-id" name="user_id" placeholder="새 아이디"
                   required minlength="3" maxlength="30" pattern="[A-Za-z0-9_\-]+"
                   title="영문 · 숫자 · _ · - 로 3~30자">
            <p class="hint">영문 · 숫자 · _ · - 로 3~30자</p>
            <button type="submit">가입하기</button>
            <p class="message" id="message"></p>
        </form>

        <p class="switch">이미 아이디가 있나요? <a href="/login/">로그인</a></p>
    </main>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
