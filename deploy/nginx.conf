# docker compose의 nginx 컨테이너가 읽는 설정 파일
# (docker-compose.yml에서 /etc/nginx/conf.d/default.conf로 연결)
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # CSS/JS/이미지: web 컨테이너가 collectstatic한 공유 볼륨에서 바로 전달
    location /static/ {
        alias /static/;
    }

    # 나머지 요청은 web 컨테이너(gunicorn)로 전달
    # 'web'은 docker-compose.yml의 서비스 이름 -> compose가 자동으로 주소를 찾아 줌
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gunicorn --timeout 180과 맞춘거임 
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
