# 실행(서버): docker compose up -d --build
services:
  # ── Django + Gunicorn ──
  web:
    build: .
    container_name: 4thproject_web
    env_file: .env                     # API 키, SECRET_KEY, DEBUG, ALLOWED_HOSTS, TIDB_*
    volumes:
      - static:/app/staticfiles        # collectstatic 결과를 공유 볼륨에 저장
    expose:
      - "8000"                         # compose 네트워크 안에서만 열림 (외부 접근 불가)
    restart: always

  # ── Nginx ──
  nginx:
    image: nginx:1.27-alpine
    container_name: 4thproject_nginx
    ports:
      - "80:80"                        # EC2 80번 → nginx 컨테이너 80번 (외부에 열리는 유일한 포트)
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 레포의 설정 파일을 그대로 사용
      - static:/static:ro              # web이 모은 static 파일을 읽기 전용으로 공유
    depends_on:
      - web
    restart: always

volumes:
  static:                              # web과 nginx가 함께 쓰는 static 볼륨
